<!DOCTYPE html>
<html lang="es--">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script>
        window.onload = () => {
            const socket = io();

            const form = document.getElementById('form');
            const input = document.getElementById('input');
            const messages = document.getElementById('messages');
            const btnLogin = document.getElementById('btnLogin');
            const divLogin = document.getElementById('divLogin');
            const divChat = document.getElementById('divChat');

            let miNombre = '';

            btnLogin.addEventListener('click', () => {
                const nombre = document.getElementById('inputNombre').value;
                if (!nombre) return;

                miNombre = nombre;
                socket.emit('nombreUsuario', { nombreUsuario: nombre, estado: '', imagen: '' });

                divLogin.style.display = 'none';
                divChat.style.display = 'block';
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (input.value) {
                    socket.emit('mensaje', { texto: input.value, nombre: miNombre });
                    input.value = '';
                }
            });

            socket.on('contador', (numero) => {
                document.getElementById('numUsuarios').innerHTML = 'Hay ' + numero + ' usuarios conectados';
            });

            socket.on('nombreUsuario', (nombre) => {
                console.log(nombre.nombreUsuario + ' ha entrado con estado ' + nombre.estado);
            });

        };
    </script>
</head>

<body>
    <div id="divLogin">
        <h2>Introduce tu nombre</h2>
        <input id="inputNombre" placeholder="Nombre de usuario">
        <button id="btnLogin">Entrar al chat</button>
    </div>

    <div id="divChat">
        <p id="numUsuarios">No estás conectado</p>
        <form id="form">
            <input id="input" placeholder="Escribe un mensaje...">
            <button type="submit">Enviar</button>
        </form>
        <h2 style="padding: 12px 16px; color: #333; font-size: 15px;">Mensajes:</h2>
        <ul id="messages"></ul>
    </div>
</body>

<style>

</style>

</html>
